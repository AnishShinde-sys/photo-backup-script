name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.7', '3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 photo_backup.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test basic functionality
      run: |
        python photo_backup.py --help
        python photo_backup.py --dry-run --config config.example.yaml

  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Validate configuration example
      run: |
        python -c "import yaml; yaml.safe_load(open('config.example.yaml'))"

    - name: Check README syntax
      run: |
        pip install markdown
        python -c "import markdown; markdown.markdown(open('README.md').read())"